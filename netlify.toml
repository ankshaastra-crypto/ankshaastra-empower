[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # NFT (Node File Tracing) correctly handles native modules and CJS packages.
  # esbuild CANNOT bundle: ioredis (dynamic require), pg (native bindings),
  # nodemailer (dynamic transport plugins), pdf-lib (large binary assets).
  node_bundler = "nft"
  node_version = "20"

# Map /api/* paths to the corresponding Netlify Functions
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/initiate-payment"
  to = "/.netlify/functions/initiate-payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment-status"
  to = "/.netlify/functions/payment-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment-webhook"
  to = "/.netlify/functions/payment-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/whatsapp-webhook"
  to = "/.netlify/functions/whatsapp-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/init-db"
  to = "/.netlify/functions/admin-init-db"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/orders"
  to = "/.netlify/functions/admin-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/order"
  to = "/.netlify/functions/admin-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/verify-order"
  to = "/.netlify/functions/admin-verify-order"
  status = 200
  force = true

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "unload=*"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
