VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_lUUcU7jfgfV9h2RIH041lA_L3npqtRn"

# NOTE: All SECRET values (API keys, passwords, secrets) must be added via
# Cloudflare Pages Dashboard → Settings → Variables & Secrets → Add Secret
